name: Ozon DOM Validator

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: 

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Validator Script
        env:
          NTFY_TOPIC: "fairprice_ozon_alerts_777"
        run: |
          python -c "
          import time, json, urllib.request, urllib.parse
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          import os

          ntfy_topic = os.environ.get('NTFY_TOPIC', 'fairprice_ozon_alerts_777')
          
          try:
              with open('config.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
                  selectors = data.get('selectors', {})
          except Exception as e:
              print(f'Не удалось прочитать local config.json: {e}')
              selectors = {'tileRoot': 'div.tile-root', 'webPrice': '[data-widget=\"webPrice\"]'}

          tile_root = selectors.get('tileRoot', 'div.tile-root')
          web_price = selectors.get('webPrice', '[data-widget=\"webPrice\"]')

          print(f'Проверяем селекторы -> Карточки: {tile_root} | Цены: {web_price}')

          def send_alert(msg):
            try:
                req = urllib.request.Request(
                    f'https://ntfy.sh/{ntfy_topic}',
                    data=msg.encode('utf-8'),
                    headers={
                        'Title': 'FairPrice Alert: Ozon DOM',
                        'Priority': 'high',
                        'Tags': 'warning'
                    },
                    method='POST'
                )
                urllib.request.urlopen(req)
                print('Алерт успешно отправлен на ntfy.sh!')
            except Exception as err:
                print(f'Ошибка отправки алерта: {err}')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              # Делаем User-Agent более похожим на реальный десктопный браузер
              page = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
                  viewport={'width': 1920, 'height': 1080}
              ).new_page()
              
              try:
                  page.goto('https://www.ozon.ru/search/?text=кофе', timeout=40000, wait_until='domcontentloaded')
                  time.sleep(7)
                  soup = BeautifulSoup(page.content(), 'html.parser')
                  
                  cards = soup.select(tile_root)
                  print(f'Найдено карточек: {len(cards)}')

                  prices = 0
                  for c in cards[:15]:
                      if c.select_one(web_price) and '₽' in c.select_one(web_price).get_text():
                          prices += 1

                  print(f'Найдено цен: {prices}')

                  # Условие сбоя: если карточек меньше 5 (бан/смена главного контейнера) ИЛИ карточки есть, но цен 0 (смена селектора цены)
                  if len(cards) < 5:
                      err_msg = f'Критический сбой или блок! Найдено карточек: {len(cards)}. Селектор tileRoot ({tile_root}) устарел или Ozon заблокировал бота.'
                      print(err_msg)
                      send_alert(err_msg)
                  elif prices == 0:
                      err_msg = f'Сбой вёрстки! Карточек найдено: {len(cards)}, но цен: 0. Селектор цены ({web_price}) устарел!'
                      print(err_msg)
                      send_alert(err_msg)
                  else:
                      print('Всё отлично, селекторы актуальны и цены найдены.')
              except Exception as e:
                  err_msg = f'Ошибка GitHub Actions при валидации: {str(e)}'
                  print(err_msg)
                  send_alert(err_msg)
              finally:
                  browser.close()
          "
