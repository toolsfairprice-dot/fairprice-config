name: Ozon DOM Validator

on:
  schedule:
    # Запуск 2 раза в сутки: в 08:17 и 20:17 по Москве (05:17 и 17:17 по UTC)
    - cron: '17 5,17 * * *'
  workflow_dispatch: # Позволяет запускать проверку вручную кнопкой на сайте GitHub

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright

      - name: Install Playwright Browsers
        run: playwright install chromium

      - name: Run Validator Script
        env:
          NTFY_TOPIC: "fairprice_ozon_alerts_777"
        run: |
          python -c "
          import time, json, urllib.request, os
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          ntfy_topic = os.environ.get('NTFY_TOPIC', 'fairprice_ozon_alerts_777')

          try:
              with open('config.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
                  selectors = data.get('selectors', {})
          except Exception as e:
              print(f'Не удалось прочитать local config.json: {e}')
              selectors = {
                  'tileRoot': 'div.tile-root',
                  'productLink': 'a[href*=\"/product/\"]',
                  'webPrice': '[data-widget=\"webPrice\"]',
                  'productTitle': 'h1'
              }

          tile_root = selectors.get('tileRoot', 'div.tile-root')
          product_link_sel = selectors.get('productLink', 'a[href*=\"/product/\"]')
          web_price_sel = selectors.get('webPrice', '[data-widget=\"webPrice\"]')
          title_sel = selectors.get('productTitle', 'h1')

          def send_alert(msg, title='FairPrice Cloud Validator', priority='high', tags='rotating_light'):
              try:
                  req = urllib.request.Request(
                      f'https://ntfy.sh/{ntfy_topic}',
                      data=msg.encode('utf-8'),
                      headers={'Title': title, 'Priority': priority, 'Tags': tags},
                      method='POST'
                  )
                  urllib.request.urlopen(req)
                  print(f'Уведомление [{title}] отправлено в ntfy.sh!')
              except Exception as err:
                  print(f'Ошибка отправки алерта: {err}')

          def guess_new_widget(soup_root):
              widgets = []
              for el in soup_root.find_all(['span', 'div', 'b']):
                  txt = el.get_text(strip=True)
                  if '₽' in txt and len(txt) < 25 and any(c.isdigit() for c in txt):
                      curr = el
                      for _ in range(7):
                          if not curr or curr.name == 'body': break
                          if curr.has_attr('data-widget'):
                              w = curr['data-widget']
                              if 'price' in w.lower() or 'sale' in w.lower():
                                  widgets.insert(0, f'[data-widget=\"{w}\"]')
                              else:
                                  widgets.append(f'[data-widget=\"{w}\"]')
                              break
                          curr = curr.parent
              return list(dict.fromkeys(widgets))[:3]

          def guess_new_card(soup_root):
              cards = []
              for link in soup_root.select('a[href*=\"/product/\"]')[:5]:
                  parent = link.parent
                  for _ in range(5):
                      if not parent or parent.name == 'body': break
                      if '₽' in parent.get_text() and parent.find('img') and parent.has_attr('class'):
                          cls = '.'.join(parent['class'])
                          if cls:
                              cards.append(f'{parent.name}.{cls}')
                              break
                      parent = parent.parent
              return list(dict.fromkeys(cards))[:3]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
                  viewport={'width': 1920, 'height': 1080}
              ).new_page()

              try:
                  page.goto('https://www.ozon.ru/search/?text=кофе', timeout=40000, wait_until='domcontentloaded')
                  time.sleep(6)
                  html_search = page.content()

                  if 'Похоже, нет соединения' in html_search or 'Доступ ограничен' in html_search or 'Antibot' in (page.title() or ''):
                      print('[INFO] Облачный сервер GitHub заблокирован антиботом Ozon. Завершение без спама.')
                      exit(0)

                  soup_search = BeautifulSoup(html_search, 'html.parser')
                  cards = soup_search.select(tile_root)
                  print(f'[INFO] Найдено карточек в поиске: {len(cards)}')

                  if len(cards) < 5:
                      guesses = guess_new_card(soup_search)
                      guesses_txt = '\n'.join(guesses) if guesses else 'Не определено'
                      msg = f'🚨 GitHub Actions: СЛОМАЛСЯ СЕЛЕКТОР КАРТОЧКИ!\nПо \"{tile_root}\" найдено {len(cards)} шт.\nВозможные новые:\n{guesses_txt}'
                      print(msg)
                      send_alert(msg, title='FairPrice Cloud: Card Selector Broken!', priority='urgent')
                      exit(0)

                  first_url = None
                  for c in cards[:10]:
                      l = c.select_one(product_link_sel)
                      if l and l.has_attr('href'):
                          href = l['href']
                          first_url = href if href.startswith('http') else 'https://www.ozon.ru' + href
                          break

                  if not first_url:
                      send_alert(f'🚨 GitHub Actions: не найден селектор ссылки {product_link_sel}', title='FairPrice Cloud: Link Error', priority='high')
                      exit(0)

                  page.goto(first_url, timeout=40000, wait_until='domcontentloaded')
                  time.sleep(6)
                  html_prod = page.content()
                  soup_prod = BeautifulSoup(html_prod, 'html.parser')

                  h1_el = soup_prod.select_one(title_sel)
                  web_price_el = soup_prod.select_one(web_price_sel)

                  if not h1_el or not h1_el.get_text(strip=True):
                      send_alert(f'🚨 GitHub Actions: не найден заголовок товара ({title_sel})', title='FairPrice Cloud: Title Broken', priority='high')
                      exit(0)

                  if not web_price_el or '₽' not in web_price_el.get_text():
                      guesses = guess_new_widget(soup_prod)
                      guesses_txt = '\n'.join(guesses) if guesses else 'Не определено'
                      msg = f'🚨 GitHub Actions: СЛОМАЛСЯ СЕЛЕКТОР ЦЕНЫ \"{web_price_sel}\"!\nВозможные новые:\n{guesses_txt}'
                      print(msg)
                      send_alert(msg, title='FairPrice Cloud: Price Broken!', priority='urgent')
                  else:
                      # Всё в порядке — просто пишем в лог, пуш не шлём!
                      print('[OK] Всё отлично! Поиск и карточка товара работают штатно. Уведомление не отправляется.')

              except Exception as e:
                  print(f'[WARN] Ошибка выполнения в облаке: {e}')
              finally:
                  browser.close()
          "
